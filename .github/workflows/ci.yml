name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check

  # Baskets live in ~/.deveggs now; my-basket/ is the legacy in-checkout location
  # (gitignored). Anything committed here would land in everyone's checkout on
  # `git pull`, so upstream rejects it. Shared baskets go in
  # shared-baskets/<github-username>/ instead.
  upstream-basket-empty:
    if: github.repository == 'kunggaochicken/deveggs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nothing is committed under my-basket/
        run: |
          stray=$(git ls-files my-basket)
          if [ -n "$stray" ]; then
            echo "::error::my-basket/ must stay empty upstream. Your basket lives in ~/.deveggs (deveggs where). To share it, copy it to shared-baskets/<your-github-username>/ (see shared-baskets/README.md)."
            echo "$stray"
            exit 1
          fi

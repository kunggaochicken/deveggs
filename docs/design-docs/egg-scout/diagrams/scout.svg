<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440" role="img" aria-labelledby="title desc">
<title id="title">deveggs scout: a fresh-context check on every prompt</title>
<desc id="desc">The developer's prompt fires a UserPromptSubmit hook. deveggs scout builds the prompt, a short transcript tail and the basket's eggs and chickens, asks a headless claude -p which apply, validates the ids, and returns additionalContext to the main session. Any failure prints nothing so the prompt goes through unchanged.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#567086"/></marker></defs>
<rect width="980" height="440" fill="#f5f8fc"/>
<text x="32" y="40" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#15344d">deveggs scout: loaded by install, noticed by the hook</text>
<g font-family="Arial,sans-serif" font-size="14" fill="#15344d">
  <!-- 1 prompt -->
  <rect x="32" y="90" width="150" height="96" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="107" y="122" text-anchor="middle" font-weight="bold">👤 Prompt</text>
  <text x="107" y="146" text-anchor="middle">developer types</text>
  <text x="107" y="166" text-anchor="middle">a request</text>
  <!-- 2 hook -->
  <rect x="222" y="90" width="170" height="96" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="307" y="122" text-anchor="middle" font-weight="bold">🪝 UserPromptSubmit</text>
  <text x="307" y="146" text-anchor="middle">settings.json entry</text>
  <text x="307" y="166" text-anchor="middle">from deveggs install</text>
  <!-- 3 scout -->
  <rect x="432" y="76" width="190" height="124" rx="10" fill="#e7f1fb" stroke="#3d7ab8" stroke-width="2"/>
  <text x="527" y="104" text-anchor="middle" font-weight="bold">🔭 deveggs scout --hook</text>
  <text x="527" y="128" text-anchor="middle">prompt + transcript tail</text>
  <text x="527" y="148" text-anchor="middle">+ eggs and chickens</text>
  <text x="527" y="168" text-anchor="middle">(id · fires when · fact)</text>
  <text x="527" y="188" text-anchor="middle">DEVEGGS_SCOUT=1 guard</text>
  <!-- 4 claude -p -->
  <rect x="662" y="90" width="150" height="96" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="737" y="118" text-anchor="middle" font-weight="bold">🤖 claude -p</text>
  <text x="737" y="142" text-anchor="middle">haiku · no tools</text>
  <text x="737" y="162" text-anchor="middle">no MCP · no settings</text>
  <text x="737" y="180" text-anchor="middle">{"apply":[…]}</text>
  <!-- 5 main session -->
  <rect x="432" y="270" width="190" height="96" rx="10" fill="#eaf6ec" stroke="#3f8f52" stroke-width="2"/>
  <text x="527" y="300" text-anchor="middle" font-weight="bold">🧠 Main session</text>
  <text x="527" y="324" text-anchor="middle">additionalContext:</text>
  <text x="527" y="344" text-anchor="middle">id · fact · why → cite</text>
  <!-- logs -->
  <rect x="662" y="270" width="150" height="96" rx="10" fill="#ffffff" stroke="#8aa4ba" stroke-dasharray="5 4"/>
  <text x="737" y="304" text-anchor="middle" font-weight="bold">📜 logs/scout.log</text>
  <text x="737" y="328" text-anchor="middle">ms · ids · error</text>
  <text x="737" y="348" text-anchor="middle">one JSON line a run</text>
  <!-- fail open -->
  <rect x="222" y="270" width="170" height="96" rx="10" fill="#fff6e6" stroke="#c48a1c"/>
  <text x="307" y="300" text-anchor="middle" font-weight="bold">🚪 Fail open</text>
  <text x="307" y="324" text-anchor="middle">timeout, error, no match:</text>
  <text x="307" y="344" text-anchor="middle">no output, exit 0</text>
</g>
<g stroke="#567086" stroke-width="2" fill="none">
  <path d="M182 138 L218 138" marker-end="url(#arrow)"/>
  <path d="M392 138 L428 138" marker-end="url(#arrow)"/>
  <path d="M622 128 L658 128" marker-end="url(#arrow)"/>
  <path d="M658 152 L626 152" marker-end="url(#arrow)"/>
  <path d="M527 200 L527 266" marker-end="url(#arrow)"/>
  <path d="M600 200 L690 266" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
  <path d="M460 200 L350 266" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
</g>
<g font-family="Arial,sans-serif" font-size="12" fill="#567086">
  <text x="538" y="240">ids validated</text>
  <text x="352" y="236">on any failure</text>
  <text x="32" y="410">The prompt is never blocked: the scout adds context or nothing. Codex and Gemini keep the instruction-only path.</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" role="img" aria-labelledby="title desc">
<title id="title">deveggs scout: native hook, native or default-agent checker</title>
<desc id="desc">Each harness runs the scout through its own prompt hook. Claude Code: a UserPromptSubmit hook in ~/.claude/settings.json runs deveggs scout --hook --harness claude-code, which asks its own claude -p on Haiku and injects additionalContext. Codex: a UserPromptSubmit hook in ~/.codex/hooks.json runs deveggs scout --hook --harness codex, which asks its own codex exec on gpt-6-luna and injects additionalContext. Antigravity: a PreInvocation hook named deveggs-scout in ~/.gemini/config/hooks.json runs deveggs scout --hook --harness antigravity; agy -p can't run isolated, so on invocation 0 it asks the default scout agent picked at deveggs install (claude -p or codex exec) and injects an ephemeral step, re-sent on later model calls of the same turn. The shared core in the middle builds the candidates, prompt and verdict and fails open. Gemini CLI and Cursor are not yet wired and keep the instruction-only path.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#567086"/></marker></defs>
<rect width="980" height="640" fill="#f5f8fc"/>
<text x="24" y="36" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#15344d">deveggs scout: the hook is always native; the checker can be borrowed</text>
<g font-family="Arial,sans-serif" font-size="12" fill="#567086" font-weight="bold">
  <text x="99" y="66" text-anchor="middle">1 HARNESS</text>
  <text x="284" y="66" text-anchor="middle">2 ITS OWN HOOK</text>
  <text x="489" y="66" text-anchor="middle">3 SHARED CORE</text>
  <text x="694" y="66" text-anchor="middle">4 HEADLESS CHECKER</text>
  <text x="884" y="66" text-anchor="middle">5 INJECTION</text>
</g>

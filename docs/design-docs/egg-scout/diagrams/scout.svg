<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
<title id="title">deveggs scout: native to each harness</title>
<desc id="desc">Each harness runs the scout through its own prompt hook and its own headless CLI. Claude Code: a UserPromptSubmit hook in ~/.claude/settings.json runs deveggs scout --hook --harness claude-code, which asks claude -p on Haiku and injects additionalContext. Codex: a UserPromptSubmit hook in ~/.codex/hooks.json runs deveggs scout --hook --harness codex, which asks codex exec on gpt-6-luna and injects additionalContext. The shared core in the middle builds the candidates, prompt and verdict and fails open. Gemini CLI, Antigravity and Cursor are not yet wired and keep the instruction-only path.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#567086"/></marker></defs>
<rect width="980" height="520" fill="#f5f8fc"/>
<text x="24" y="36" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#15344d">deveggs scout: each harness scouts itself</text>
<g font-family="Arial,sans-serif" font-size="12" fill="#567086" font-weight="bold">
  <text x="99" y="66" text-anchor="middle">1 HARNESS</text>
  <text x="284" y="66" text-anchor="middle">2 ITS OWN HOOK</text>
  <text x="489" y="66" text-anchor="middle">3 SHARED CORE</text>
  <text x="694" y="66" text-anchor="middle">4 ITS OWN HEADLESS CLI</text>
  <text x="884" y="66" text-anchor="middle">5 INJECTION</text>
</g>
<g font-family="Arial,sans-serif" font-size="13" fill="#15344d">
  <!-- Claude Code row -->
  <rect x="24" y="80" width="150" height="90" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="99" y="112" text-anchor="middle" font-weight="bold">🟠 Claude Code</text>
  <text x="99" y="134" text-anchor="middle">developer's prompt</text>
  <rect x="194" y="80" width="180" height="90" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="284" y="106" text-anchor="middle" font-weight="bold">🪝 UserPromptSubmit</text>
  <text x="284" y="128" text-anchor="middle">~/.claude/settings.json</text>
  <text x="284" y="148" text-anchor="middle">--harness claude-code</text>
  <rect x="604" y="80" width="180" height="90" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="694" y="106" text-anchor="middle" font-weight="bold">🤖 claude -p</text>
  <text x="694" y="128" text-anchor="middle">haiku · no tools · no MCP</text>
  <text x="694" y="148" text-anchor="middle">no settings · no session</text>
  <rect x="804" y="80" width="160" height="90" rx="10" fill="#eaf6ec" stroke="#3f8f52" stroke-width="2"/>
  <text x="884" y="106" text-anchor="middle" font-weight="bold">🧠 same session</text>
  <text x="884" y="128" text-anchor="middle">additionalContext</text>
  <text x="884" y="148" text-anchor="middle">id · fact · why</text>

  <!-- Codex row -->
  <rect x="24" y="200" width="150" height="90" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="99" y="232" text-anchor="middle" font-weight="bold">⚫ Codex</text>
  <text x="99" y="254" text-anchor="middle">developer's prompt</text>
  <rect x="194" y="200" width="180" height="90" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="284" y="226" text-anchor="middle" font-weight="bold">🪝 UserPromptSubmit</text>
  <text x="284" y="248" text-anchor="middle">~/.codex/hooks.json</text>
  <text x="284" y="268" text-anchor="middle">--harness codex</text>
  <rect x="604" y="200" width="180" height="90" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="694" y="226" text-anchor="middle" font-weight="bold">🤖 codex exec</text>
  <text x="694" y="248" text-anchor="middle">gpt-6-luna · ephemeral</text>
  <text x="694" y="268" text-anchor="middle">read-only · hooks off</text>
  <rect x="804" y="200" width="160" height="90" rx="10" fill="#eaf6ec" stroke="#3f8f52" stroke-width="2"/>
  <text x="884" y="226" text-anchor="middle" font-weight="bold">🧠 same session</text>
  <text x="884" y="248" text-anchor="middle">additionalContext</text>
  <text x="884" y="268" text-anchor="middle">id · fact · why</text>

  <!-- Shared core spanning both rows -->
  <rect x="394" y="80" width="190" height="210" rx="10" fill="#e7f1fb" stroke="#3d7ab8" stroke-width="2"/>
  <text x="489" y="108" text-anchor="middle" font-weight="bold">🔭 deveggs scout --hook</text>
  <text x="489" y="134" text-anchor="middle">prompt + transcript tail</text>
  <text x="489" y="154" text-anchor="middle">(its harness's reader)</text>
  <text x="489" y="180" text-anchor="middle">eggs + chickens:</text>
  <text x="489" y="200" text-anchor="middle">id · fires when · fact</text>
  <text x="489" y="226" text-anchor="middle">ids validated · why cleaned</text>
  <text x="489" y="252" text-anchor="middle">DEVEGGS_SCOUT=1 guard</text>
  <text x="489" y="272" text-anchor="middle">fails open · logs/scout.log</text>

  <!-- Not yet row -->
  <rect x="24" y="330" width="940" height="76" rx="10" fill="#f0f0f0" stroke="#9a9a9a" stroke-dasharray="5 4"/>
  <text x="44" y="358" font-weight="bold" fill="#555555">⬜ not yet: instruction-only path</text>
  <text x="44" y="382" fill="#555555">Antigravity: PreInvocation hook injects, but agy -p saves every run and runs hooks · Gemini CLI: superseded, untested</text>
  <text x="44" y="400" fill="#555555">Cursor: beforeSubmitPrompt can't add context</text>
</g>
<g stroke="#567086" stroke-width="2" fill="none">
  <path d="M174 125 L190 125" marker-end="url(#arrow)"/>
  <path d="M374 125 L390 125" marker-end="url(#arrow)"/>
  <path d="M584 125 L600 125" marker-end="url(#arrow)"/>
  <path d="M784 125 L800 125" marker-end="url(#arrow)"/>
  <path d="M174 245 L190 245" marker-end="url(#arrow)"/>
  <path d="M374 245 L390 245" marker-end="url(#arrow)"/>
  <path d="M584 245 L600 245" marker-end="url(#arrow)"/>
  <path d="M784 245 L800 245" marker-end="url(#arrow)"/>
</g>
<g font-family="Arial,sans-serif" font-size="12" fill="#567086">
  <text x="24" y="446">Each row stays inside its harness: a Codex session is scouted by codex exec and never calls Claude, and the reverse.</text>
  <text x="24" y="468">The prompt is never blocked: on a timeout, an error or no match the hook prints nothing and exits 0.</text>
  <text x="24" y="490">deveggs install writes each hook (Codex runs it once you trust it in /hooks); deveggs uninstall removes exactly it.</text>
</g>
</svg>

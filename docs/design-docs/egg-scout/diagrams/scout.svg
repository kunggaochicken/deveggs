<g stroke="#567086" stroke-width="2" fill="none">
  <path d="M174 125 L190 125" marker-end="url(#arrow)"/>
  <path d="M374 125 L390 125" marker-end="url(#arrow)"/>
  <path d="M584 125 L600 125" marker-end="url(#arrow)"/>
  <path d="M784 125 L800 125" marker-end="url(#arrow)"/>
  <path d="M174 235 L190 235" marker-end="url(#arrow)"/>
  <path d="M374 235 L390 235" marker-end="url(#arrow)"/>
  <path d="M584 235 L600 235" marker-end="url(#arrow)"/>
  <path d="M784 235 L800 235" marker-end="url(#arrow)"/>
  <path d="M174 355 L190 355" marker-end="url(#arrow)"/>
  <path d="M374 355 L390 355" marker-end="url(#arrow)"/>
  <path d="M584 355 L600 355" marker-end="url(#arrow)" stroke="#c98a1b"/>
  <path d="M784 355 L800 355" marker-end="url(#arrow)"/>
</g>
<g font-family="Arial,sans-serif" font-size="12" fill="#567086">
  <text x="24" y="548">A harness with an isolated headless mode always checks with it: Codex never calls Claude, and the reverse. Only Antigravity borrows.</text>
  <text x="24" y="570">The prompt is never blocked: on a timeout, an error, no default or no match the hook prints nothing and exits 0.</text>
  <text x="24" y="592">deveggs install writes each hook and asks for the default once per machine (or takes --scout-default); deveggs uninstall removes exactly them.</text>
</g>
</svg>

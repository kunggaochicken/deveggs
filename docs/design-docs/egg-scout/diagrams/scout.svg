  <text x="694" y="106" text-anchor="middle" font-weight="bold">🤖 native: claude -p</text>
  <text x="694" y="128" text-anchor="middle">haiku · no tools · no MCP</text>
  <text x="694" y="148" text-anchor="middle">no settings · no session</text>
  <rect x="804" y="80" width="160" height="90" rx="10" fill="#eaf6ec" stroke="#3f8f52" stroke-width="2"/>
  <text x="884" y="106" text-anchor="middle" font-weight="bold">🧠 same session</text>
  <text x="884" y="128" text-anchor="middle">additionalContext</text>
  <text x="884" y="148" text-anchor="middle">id · fact · why</text>

  <!-- Codex row -->
  <rect x="24" y="190" width="150" height="90" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="99" y="222" text-anchor="middle" font-weight="bold">⚫ Codex</text>
  <text x="99" y="244" text-anchor="middle">developer's prompt</text>
  <rect x="194" y="190" width="180" height="90" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="284" y="216" text-anchor="middle" font-weight="bold">🪝 UserPromptSubmit</text>
  <text x="284" y="238" text-anchor="middle">~/.codex/hooks.json</text>
  <text x="284" y="258" text-anchor="middle">--harness codex</text>
  <rect x="604" y="190" width="180" height="90" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="694" y="216" text-anchor="middle" font-weight="bold">🤖 native: codex exec</text>
  <text x="694" y="238" text-anchor="middle">gpt-6-luna · ephemeral</text>
  <text x="694" y="258" text-anchor="middle">read-only · hooks off</text>
  <rect x="804" y="190" width="160" height="90" rx="10" fill="#eaf6ec" stroke="#3f8f52" stroke-width="2"/>
  <text x="884" y="216" text-anchor="middle" font-weight="bold">🧠 same session</text>
  <text x="884" y="238" text-anchor="middle">additionalContext</text>
  <text x="884" y="258" text-anchor="middle">id · fact · why</text>

  <!-- Antigravity row -->
  <rect x="24" y="300" width="150" height="110" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="99" y="336" text-anchor="middle" font-weight="bold">🔵 Antigravity</text>
  <text x="99" y="358" text-anchor="middle">developer's prompt</text>
  <text x="99" y="378" text-anchor="middle">(agy -p can't run</text>
  <text x="99" y="396" text-anchor="middle">isolated)</text>
  <rect x="194" y="300" width="180" height="110" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="284" y="326" text-anchor="middle" font-weight="bold">🪝 PreInvocation</text>
  <text x="284" y="348" text-anchor="middle">~/.gemini/config/hooks.json</text>
  <text x="284" y="368" text-anchor="middle">deveggs-scout</text>
  <text x="284" y="388" text-anchor="middle">--harness antigravity</text>
  <rect x="604" y="300" width="180" height="110" rx="10" fill="#fff6e5" stroke="#c98a1b" stroke-width="2"/>
  <text x="694" y="326" text-anchor="middle" font-weight="bold">🔁 default scout agent</text>
  <text x="694" y="348" text-anchor="middle">claude -p or codex exec</text>
  <text x="694" y="368" text-anchor="middle">picked at deveggs install</text>
  <text x="694" y="388" text-anchor="middle">only on invocation 0</text>
  <rect x="804" y="300" width="160" height="110" rx="10" fill="#eaf6ec" stroke="#3f8f52" stroke-width="2"/>
  <text x="884" y="326" text-anchor="middle" font-weight="bold">🧠 same session</text>
  <text x="884" y="348" text-anchor="middle">injectSteps:</text>
  <text x="884" y="368" text-anchor="middle">ephemeralMessage</text>
  <text x="884" y="388" text-anchor="middle">re-sent each call</text>

  <!-- Shared core spanning all rows -->
  <rect x="394" y="80" width="190" height="330" rx="10" fill="#e7f1fb" stroke="#3d7ab8" stroke-width="2"/>
  <text x="489" y="110" text-anchor="middle" font-weight="bold">🔭 deveggs scout --hook</text>
  <text x="489" y="140" text-anchor="middle">prompt + transcript tail</text>
  <text x="489" y="160" text-anchor="middle">(its harness's reader)</text>
  <text x="489" y="194" text-anchor="middle">eggs + chickens:</text>
  <text x="489" y="214" text-anchor="middle">id · fires when · fact</text>
  <text x="489" y="248" text-anchor="middle">checker: native, else</text>
  <text x="489" y="268" text-anchor="middle" font-size="12">DEVEGGS_SCOUT_DEFAULT,</text>
  <text x="489" y="288" text-anchor="middle" font-size="12">else deveggs.scoutDefault</text>
  <text x="489" y="322" text-anchor="middle">ids validated · why cleaned</text>
  <text x="489" y="346" text-anchor="middle">DEVEGGS_SCOUT=1 guard</text>
  <text x="489" y="370" text-anchor="middle">fails open · logs/scout.log</text>
  <text x="489" y="390" text-anchor="middle">(checker: native | fallback:…)</text>

  <!-- Not yet row -->
  <rect x="24" y="440" width="940" height="70" rx="10" fill="#f0f0f0" stroke="#9a9a9a" stroke-dasharray="5 4"/>
  <text x="44" y="468" font-weight="bold" fill="#555555">⬜ not yet: instruction-only path (a default agent can't help these)</text>
  <text x="44" y="492" fill="#555555">Gemini CLI: BeforeAgent documented but untested here, superseded by Antigravity CLI · Cursor: beforeSubmitPrompt can't add context</text>

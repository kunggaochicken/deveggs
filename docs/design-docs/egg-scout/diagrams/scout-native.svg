<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">deveggs scout: each harness's native trigger, its scout, and the injection</title>
<desc id="desc">Rows per harness. Claude Code: spawn from code. The deveggs mod (a plugin linked into ~/.claude/skills) handles prompt.submit, starts a hidden deveggs:deveggs-scout subagent in Claude Code itself (Haiku, no tools, no CLAUDE.md), waits up to 5 s and adds its answer as prompt context, else appends it when it lands; the UserPromptSubmit command hook stays as the fallback and is silent while the mod scouts. Codex: fallback CLI. The UserPromptSubmit hook runs codex exec; the native subagent plus gate was tried and ran the scout in 1 of 3 turns, and the app-server scout thread is slower cold. Antigravity: fallback default agent. The PreInvocation hook runs the default scout agent's CLI; its gate is unverified because agy needs the keychain login. Cursor: none; its prompt hook can inject only in the TUI and its gate is unverified. The shared core builds the question and checks the verdict for every row.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#567086"/></marker></defs>
<rect width="1000" height="600" fill="#f5f8fc"/>
<text x="24" y="36" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#15344d">deveggs scout: native where the harness lets code start its own subagent</text>
<g font-family="Arial,sans-serif" font-size="12" fill="#567086" font-weight="bold">
  <text x="94" y="66" text-anchor="middle">1 HARNESS</text>
  <text x="289" y="66" text-anchor="middle">2 NATIVE TRIGGER (code)</text>
  <text x="529" y="66" text-anchor="middle">3 THE SCOUT</text>
  <text x="749" y="66" text-anchor="middle">4 INJECTION</text>
  <text x="914" y="66" text-anchor="middle">MECHANISM</text>
</g>
<g font-family="Arial,sans-serif" font-size="13" fill="#15344d">
  <!-- Claude Code -->
  <rect x="24" y="80" width="140" height="100" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="94" y="124" text-anchor="middle" font-weight="bold">🟠 Claude Code</text>
  <text x="94" y="146" text-anchor="middle">≥ 2.1.287</text>
  <rect x="184" y="80" width="210" height="100" rx="10" fill="#ffffff" stroke="#3f8f52" stroke-width="2"/>
  <text x="289" y="104" text-anchor="middle" font-weight="bold">🧩 deveggs mod</text>
  <text x="289" y="124" text-anchor="middle">prompt.submit → $.agent.spawn</text>
  <text x="289" y="144" text-anchor="middle">~/.claude/skills/deveggs-scout</text>
  <text x="289" y="164" text-anchor="middle" fill="#567086">fallback hook: silent (marked)</text>
  <rect x="414" y="80" width="230" height="100" rx="10" fill="#eaf6ec" stroke="#3f8f52" stroke-width="2"/>
  <text x="529" y="104" text-anchor="middle" font-weight="bold">🤖 its own subagent</text>
  <text x="529" y="124" text-anchor="middle">deveggs:deveggs-scout</text>
  <text x="529" y="144" text-anchor="middle">haiku · no tools · no CLAUDE.md</text>
  <text x="529" y="164" text-anchor="middle">hidden from the model</text>
  <rect x="664" y="80" width="170" height="100" rx="10" fill="#eaf6ec" stroke="#3f8f52" stroke-width="2"/>
  <text x="749" y="108" text-anchor="middle" font-weight="bold">🧠 prompt context</text>
  <text x="749" y="130" text-anchor="middle">≤ 5 s: added to the prompt</text>
  <text x="749" y="150" text-anchor="middle">later: appended</text>
  <text x="914" y="124" text-anchor="middle" font-weight="bold">✅ spawn</text>
  <text x="914" y="144" text-anchor="middle" font-weight="bold">from code</text>

  <!-- Codex -->
  <rect x="24" y="200" width="140" height="90" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="94" y="250" text-anchor="middle" font-weight="bold">🟢 Codex</text>
  <rect x="184" y="200" width="210" height="90" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="289" y="230" text-anchor="middle" font-weight="bold">🪝 UserPromptSubmit</text>
  <text x="289" y="252" text-anchor="middle">~/.codex/hooks.json</text>

  <rect x="664" y="310" width="170" height="90" rx="10" fill="#eaf6ec" stroke="#3f8f52"/>
  <text x="749" y="350" text-anchor="middle" font-weight="bold">🧠 ephemeral step</text>
  <text x="749" y="372" text-anchor="middle">re-sent each call</text>
  <text x="914" y="350" text-anchor="middle" font-weight="bold">🔁 fallback</text>
  <text x="914" y="370" text-anchor="middle" font-weight="bold">default agent</text>

  <!-- Cursor -->
  <rect x="24" y="420" width="140" height="70" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="94" y="460" text-anchor="middle" font-weight="bold">⚪ Cursor</text>
  <rect x="184" y="420" width="650" height="70" rx="10" fill="#fbf3e6" stroke="#c39a54"/>
  <text x="509" y="450" text-anchor="middle">beforeSubmitPrompt injects in the TUI only (not -p); agents and a gate exist in its bundle, untested</text>
  <text x="509" y="472" text-anchor="middle" fill="#567086">preferences still load from the rules the developer pastes</text>
  <text x="914" y="460" text-anchor="middle" font-weight="bold">⬜ none yet</text>

  <!-- shared core -->
  <rect x="184" y="510" width="650" height="64" rx="10" fill="#e9f0f8" stroke="#567086"/>
  <text x="509" y="536" text-anchor="middle" font-weight="bold">⚙️ shared core (src/scout.ts): candidates · question · verdict check · log · fail open</text>
  <text x="509" y="558" text-anchor="middle">the mod asks it through deveggs scout --subagent spec | ask | verdict</text>
</g>

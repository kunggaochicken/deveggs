  <rect x="24" y="310" width="140" height="90" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="94" y="360" text-anchor="middle" font-weight="bold">🔵 Antigravity</text>
  <rect x="184" y="310" width="210" height="90" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="289" y="340" text-anchor="middle" font-weight="bold">🪝 PreInvocation</text>

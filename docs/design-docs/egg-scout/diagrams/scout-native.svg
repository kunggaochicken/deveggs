  <rect x="414" y="310" width="230" height="90" rx="10" fill="#ffffff" stroke="#8aa4ba"/>
  <text x="529" y="340" text-anchor="middle" font-weight="bold">💻 default scout agent</text>
  <text x="529" y="362" text-anchor="middle">claude -p or codex exec</text>
